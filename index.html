<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Costa 105 FM - Reproductor Ultra-Compacto</title>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --primary: #F97316;
      --primary-hover: #EA580C;
      --accent-yellow: #FBBF24;
      --accent-cyan: #06B6D4;
      --bg-dark: #0A0F1D;
      --card-bg: rgba(15, 23, 42, 0.85);
      --border-color: rgba(249, 115, 22, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: transparent;
      color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
    }

    .player-card {
      width: 100%;
      max-width: 360px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 12px 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 
                  0 0 20px rgba(249, 115, 22, 0.15);
      position: relative;
      overflow: hidden;
    }

    /* Ambient Background Glow */
    .player-card::before {
      content: '';
      position: absolute;
      top: -30%;
      right: -20%;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(249, 115, 22, 0.25) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
    }

    .player-card::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -20%;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.2) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .station-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--accent-cyan);
      text-transform: uppercase;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #EF4444;
      border-radius: 50%;
      box-shadow: 0 0 8px #EF4444;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    .live-tag {
      background: rgba(239, 68, 68, 0.15);
      color: #EF4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 0.65rem;
      font-weight: 800;
    }

    /* Layout Principal Fila */
    .main-row {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 2;
    }

    /* Carátula / Vinyl */
    .cover-container {
      position: relative;
      width: 58px;
      height: 58px;
      flex-shrink: 0;
    }

    .cover-art {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 1
